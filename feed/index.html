<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse — Feed</title>
    <link rel="icon" href="../images/logo.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/output.css" />
</head>

<body class="flex flex-col min-h-screen bg-background  text-white">
    <!-- navbar -->
    <header
        class="sticky top-0 z-30 w-full flex items-center justify-between bg-surface px-6 py-4   border-b border-border">
        <a href="./index.html">
            <svg width="100" height="36" viewBox="0 0 360 112" fill="none" xmlns="http://www.w3.org/2000/svg"
                aria-label="Pulse logo" role="img">
                <g stroke="#06b6d4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M70 22C38 22 14 44 14 72c0 12 5 23 13 31l-7 25 29-11c7 3 14 5 22 5 32 0 56-22 56-50S102 22 70 22Z" />
                    <path d="M35 73h28l10-25 14 47 11-22h24" />
                    <path d="M116 18c14 5 25 16 30 30" />
                    <path d="M130 6c18 7 32 21 39 39" />
                </g>
                <text x="155" y="84" fill="#06b6d4" font-size="64" font-weight="700"
                    font-family="Inter, Arial, sans-serif">Pulse</text>
            </svg>
        </a>

        <!-- search bar -->
        <div
            class="flex items-center gap-2 w-full  max-w-sm mx-6 px-4 py-2 bg-background focus-within:border-cyan-500 border border-border transition-colors">
            <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <input type="text" placeholder="Search Pulse..."
                class="w-full bg-transparent text-white text-sm placeholder:text-gray-600 focus:outline-none" />
        </div>

        <!-- nav right - desktop -->
        <div class="relative hidden md:flex items-center  gap-4">
            <button id="user-trigger"
                class="flex items-center gap-2 text-sm text-gray-400 hover:text-white transition-colors  cursor-pointer">
                <img src="https://i.pravatar.cc/32" alt="avatar"
                    class="w-8 h-8 min-w-8 min-h-8 rounded-full object-cover" />
                <span>@kaderH</span>
            </button>

            <!-- desktop dropdown -->
            <div id="user-dropdown"
                class="hidden absolute right-0 top-full mt-2 flex flex-col w-40 bg-surface border border-border z-50">
                <a href="../profile/index.html"
                    class="px-4 py-3 text-sm text-cyan-500 hover:bg-[#222] transition-colors">Profile</a>
                <a href="../index.html"
                    class="px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-[#222] transition-colors border-t border-border">Logout</a>
            </div>
        </div>

        <!-- hamburger - mobile -->
        <div class="relative md:hidden">
            <button id="menu-toggle" class="flex flex-col gap-1.5 cursor-pointer p-2">
                <span class="w-6 h-0.5 bg-white block"></span>
                <span class="w-6 h-0.5 bg-white block"></span>
                <span class="w-6 h-0.5 bg-white block"></span>
            </button>

            <!-- mobile dropdown -->
            <div id="mobile-menu"
                class="hidden absolute right-0 top-full  mt-1 w-56 bg-surface border border-border z-50 flex flex-col">

                <!-- user info -->
                <div class="flex items-center gap-3 px-4 py-3 border-b border-border">
                    <img src="https://i.pravatar.cc/32" alt="avatar"
                        class="w-8 h-8 min-w-8 rounded-full object-cover" />
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-white">Lakhdar Hafsi</span>
                        <span class="text-xs text-gray-400">@kaderH</span>
                    </div>
                </div>

                <!-- nav links -->
                <a href="./index.html"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-cyan-500 hover:bg-[#222] transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                    Home
                </a>
                <a href="../profile/index.html"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-[#222] transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    Profile
                </a>
                <a href="#"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-[#222] transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    Notifications
                </a>
                <a href="#"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-[#222] transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    Messages
                </a>
                <a href="../index.html"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-[#222] transition-colors border-t border-border">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Logout
                </a>
            </div>
        </div>

    </header>

    <!-- main layout -->
    <div class="flex flex-col w-full md:grid md:grid-cols-[220px_1fr_240px] gap-6  max-w-6xl mx-auto px-4 py-8">

        <!-- sidebar left -->
        <aside class="hidden md:flex flex-col items-start gap-1">
            <nav class="flex flex-col w-full gap-1">
                <a href="#"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-cyan-500 bg-surface border border-border font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                    Home
                </a>
                <a href="../profile/index.html"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-surface transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    Profile
                </a>
                <a href="#"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-surface transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    Notifications
                </a>
                <a href="#"
                    class="flex items-center gap-3 px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-surface transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    Messages
                </a>
            </nav>
        </aside>

        <!-- feed content -->
        <div class="flex flex-col items-start gap-6">
            <!-- create a post -->
            <form id="create-post-form" class="flex flex-col w-full gap-3 p-4 bg-surface border border-border">
                <div class="flex items-start gap-3">
                    <img src="https://i.pravatar.cc/36" alt="avatar" class="w-9 h-9 rounded-full shrink-0" />
                    <textarea id="post-content" name="post" required placeholder="What's on your mind?" rows="2"
                        class="w-full px-3 py-2 bg-background border border-border text-white text-sm placeholder:text-gray-600 focus:outline-none focus:border-cyan-500 transition-colors resize-none"></textarea>
                </div>
                <div class="flex items-center justify-end">
                    <button type="submit"
                        class="px-6 py-2 bg-cyan-500 text-background text-sm  font-bold uppercase tracking-widest cursor-pointer hover:bg-cyan-600 transition-colors">
                        Post
                    </button>
                </div>
            </form>

            <!-- sorting options -->
            <div class="flex items-center gap-2">
                <button data-sort="latest"
                    class="px-4 py-1.5 text-xs font-medium text-background bg-cyan-500 cursor-pointer hover:bg-cyan-600 transition-colors">Latest</button>
                <button data-sort="popular"
                    class="px-4 py-1.5 text-xs font-medium text-gray-400 border border-border cursor-pointer hover:border-cyan-500 hover:text-white transition-colors">Popular</button>
                <button data-sort="following"
                    class="px-4 py-1.5 text-xs font-medium text-gray-400 border border-border cursor-pointer hover:border-cyan-500 hover:text-white transition-colors">Following</button>
            </div>
            <!-- posts container -->
            <main id="feed" class="flex flex-col items-start w-full gap-6"></main>

        </div>

        <!-- sidebar right -->
        <aside class="hidden md:flex flex-col items-start gap-6">

            <!-- suggested users -->
            <div class="flex flex-col w-full gap-3 p-4 bg-surface border border-border">
                <h3 class="text-xs text-gray-400 uppercase  tracking-widest">Suggested</h3>
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <img src="https://i.pravatar.cc/32?img=4" alt="avatar" class="w-8 h-8 rounded-full" />
                            <div class="flex flex-col">
                                <span class="text-xs font-medium text-white">Alex Kim</span>
                                <span class="text-xs text-gray-400">@alexkim</span>
                            </div>
                        </div>
                        <button
                            class="follow-btn px-3 py-1 text-xs text-cyan-500 border border-cyan-500 cursor-pointer hover:bg-cyan-500 hover:text-background transition-colors">Follow</button>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <img src="https://i.pravatar.cc/32?img=5" alt="avatar" class="w-8 h-8 rounded-full" />
                            <div class="flex flex-col">
                                <span class="text-xs font-medium text-white">Nina Ross</span>
                                <span class="text-xs text-gray-400">@ninaross</span>
                            </div>
                        </div>
                        <button
                            class="follow-btn px-3 py-1 text-xs text-cyan-500 border border-cyan-500 cursor-pointer hover:bg-cyan-500 hover:text-background transition-colors">Follow</button>
                    </div>
                    <div class="flex items-center justify-between  gap-2">
                        <div class="flex items-center gap-2">
                            <img src="https://i.pravatar.cc/32?img=6" alt="avatar" class="w-8 h-8 rounded-full" />
                            <div class="flex flex-col">
                                <span class="text-xs font-medium text-white">Tom Walsh</span>
                                <span class="text-xs text-gray-400">@tomwalsh</span>
                            </div>
                        </div>
                        <button
                            class="follow-btn px-3 py-1 text-xs text-cyan-500 border border-cyan-500 cursor-pointer hover:bg-cyan-500 hover:text-[#0f0f0f] transition-colors">Follow</button>
                    </div>
                </div>
            </div>

            <!-- trending tags -->
            <div class="flex flex-col w-full bg-surface gap-3 p-4 border border-border">
                <h3 class="text-xs text-gray-400 uppercase tracking-widest">Trending</h3>
                <div class="flex flex-col gap-2">
                    <a href="#"
                        class="flex items-center justify-between text-sm text-gray-400 hover:text-cyan-500 transition-colors">
                        <span>#tailwindcss</span><span class="text-xs">2.4k</span>
                    </a>
                    <a href="#"
                        class="flex items-center justify-between text-sm text-gray-400 hover:text-cyan-500 transition-colors">
                        <span>#webdev</span><span class="text-xs">1.8k</span>
                    </a>
                    <a href="#"
                        class="flex items-center justify-between text-sm text-gray-400 hover:text-cyan-500 transition-colors">
                        <span>#noroff</span><span class="text-xs">1.1k</span>
                    </a>
                    <a href="#"
                        class="flex items-center justify-between text-sm text-gray-400 hover:text-cyan-500 transition-colors">
                        <span>#uidesign</span><span class="text-xs">980</span>
                    </a>
                    <a href="#"
                        class="flex items-center justify-between text-sm text-gray-400 hover:text-cyan-500 transition-colors">
                        <span>#react</span><span class="text-xs">754</span>
                    </a>
                </div>
            </div>

        </aside>

    </div>

    <!-- footer -->
    <footer class="flex items-center justify-center w-full px-6 py-4 mt-auto border-t border-border">
        <div class="flex items-center gap-2">
            <svg width="60" height="20" viewBox="0 0 360 112" fill="none" xmlns="http://www.w3.org/2000/svg"
                aria-label="Pulse logo" role="img">
                <g stroke="#06b6d4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M70 22C38 22 14 44 14 72c0 12 5 23 13 31l-7 25 29-11c7 3 14 5 22 5 32 0 56-22 56-50S102 22 70 22Z" />
                    <path d="M35 73h28l10-25 14 47 11-22h24" />
                    <path d="M116 18c14 5 25 16 30 30" />
                    <path d="M130 6c18 7 32 21 39 39" />
                </g>
                <text x="155" y="84" fill="#06b6d4" font-size="64" font-weight="700"
                    font-family="Inter, Arial, sans-serif">Pulse</text>
            </svg>
            <p class="text-xs text-gray-600">© 2026 Pulse — Built by <a href="https://portfolio-2-tau-plum.vercel.app/"
                    target="_blank" class="hover:text-cyan-500 transition-colors">Lakhdar Hafsi</a></p>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/feed.js"></script>
</body>

</html>
